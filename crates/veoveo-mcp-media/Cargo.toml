[package]
name = "veoveo-mcp-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# Media's public types: model and prediction identities, resource addresses, tool
# requests and results, the permission vocabulary and typed calls for consumers. No
# database, runtime or provider dependency.
contract = [
    "dep:chrono",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:veoveo-sdk-rust",
    "dep:veoveo-types",
]
# The hosted server: MCP through the SDK, generations as durable Tasks parked on provider
# operations, outputs stored through Artifact's client, usage in core's ledger,
# persistence in the `media` schema and the binary.
server = [
    "contract",
    "chrono/clock",
    "veoveo-sdk-rust/server",
    "dep:anyhow",
    "dep:axum",
    "dep:bytes",
    "dep:clap",
    "dep:dotenvy",
    "dep:futures",
    "dep:hex",
    "dep:hmac",
    "dep:jsonschema",
    "dep:reqwest",
    "reqwest/stream",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "dep:tokio-util",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
    "dep:veoveo-mcp-artifact",
    "veoveo-mcp-artifact/client",
    "dep:veoveo-platform-store",
    "dep:veoveo-task-runtime",
]
# The fake provider: a stand-in for the generation provider that tests and the local
# installation run, so nothing reaches the real one.
testing = ["server"]

[dependencies]
chrono = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
veoveo-sdk-rust = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
axum = { workspace = true, features = ["http1", "tokio", "json", "query"], optional = true }
bytes = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "json"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net"] }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-mcp-artifact = { workspace = true, optional = true }
veoveo-platform-store = { workspace = true, optional = true }
veoveo-task-runtime = { workspace = true, optional = true }

[dev-dependencies]
veoveo-audit.workspace = true
veoveo-audit-contract.workspace = true
# Artifact in process: the store, object storage and hosted MCP the run tests store
# outputs through.
veoveo-mcp-artifact = { workspace = true, features = ["server", "client"] }
veoveo-platform-store.workspace = true
veoveo-sdk-rust = { workspace = true, features = ["server", "testing"] }
veoveo-oauth-client.workspace = true
# The acceptance tests call Media and Artifact through the Gateway as an MCP client.
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
# `database-conformance` holds the crate's queries and schema to core's database rules.
veoveo-test-fixtures = { workspace = true, features = ["store", "database-conformance"] }
reqwest = { workspace = true, features = ["rustls-no-provider", "json"] }
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "veoveo-mcp-media"
required-features = ["server"]

[[bin]]
name = "veoveo-mcp-media-fake-provider"
path = "src/bin/fake_provider.rs"
required-features = ["testing"]

[[test]]
name = "database_conformance"
required-features = ["server"]

[[test]]
name = "acceptance"
required-features = ["server"]

[[test]]
name = "run"
required-features = ["testing"]

[[test]]
name = "store"
required-features = ["server"]

[[test]]
name = "provider_qualification"
required-features = ["testing"]
