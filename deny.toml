# cargo-deny 0.20 policy: dependency licenses, security advisories, bans and sources.

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# Licenses compatible with distributing an Apache-2.0 project. Add a license here only
# after reviewing it, and record crate-specific cases under `exceptions`.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["VeoveoAI"]
